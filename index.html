<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b91c1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tạp Hóa">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<title>Máy Tính Tiền</title>
<style>
  :root {
    --red: #b91c1c;
    --red-dark: #7f1d1d;
    --green: #15803d;
    --blue: #1d4ed8;
    --ink: #111827;
    --muted: #374151;
    --line: #d1d5db;
    --bg: #f3f4f6;
    --card: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 20px;
    color: var(--ink);
    background: var(--bg);
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; cursor: pointer; border: none; touch-action: manipulation; }
  input { font: inherit; }

  /* ---------- Header ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--red);
    padding: 10px 12px 12px;
    padding-top: max(10px, env(safe-area-inset-top));
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
  }
  .head-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .btn-head {
    flex: 1; background: #fff; color: var(--red); font-weight: 800; font-size: 19px;
    min-height: 54px; padding: 0 8px; border-radius: 12px;
  }
  .search-wrap { position: relative; }
  .big-search {
    width: 100%; min-height: 64px; padding: 0 56px 0 16px;
    font-size: 24px; border: 3px solid #fff; border-radius: 14px;
    background: #fff; color: var(--ink); outline: none;
  }
  .big-search:focus { border-color: #fde047; }
  .big-search::placeholder { color: #6b7280; }
  .big-search::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
  #clearSearch {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 52px; height: 52px; border-radius: 10px;
    background: #e5e7eb; color: var(--ink); font-size: 26px; font-weight: 800;
    display: none;
  }
  #suggest {
    position: absolute; left: 0; right: 0; top: calc(100% + 6px);
    background: #fff; border-radius: 14px; border: 3px solid var(--ink);
    max-height: 60vh; overflow-y: auto; display: none;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  .sg-item {
    width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px;
    min-height: 68px; padding: 10px 12px; background: #fff; text-align: left;
    border-bottom: 2px solid var(--line); font-size: 22px; color: var(--ink);
  }
  .sg-item:active { background: #fef3c7; }
  .sg-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; line-height: 1.25; }

  /* Ảnh nhỏ của món */
  .thumb {
    width: 56px; height: 56px; flex-shrink: 0; border-radius: 10px;
    object-fit: cover; background: #f3f4f6; border: 2px solid var(--line);
  }
  .thumb-empty {
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; color: #9ca3af;
  }
  .sg-item .thumb { width: 76px; height: 76px; }
  .item .thumb { width: 92px; height: 92px; }
  .pl-item .thumb { width: 84px; height: 84px; }
  .sg-item .sg-price { font-weight: 800; color: var(--red); white-space: nowrap; }
  .sg-item mark { background: #fde047; color: inherit; border-radius: 3px; }
  .sg-new { color: var(--blue); font-weight: 800; justify-content: center; }
  .sg-count { padding: 8px 16px; font-size: 17px; color: var(--muted); background: #f9fafb; border-bottom: 2px solid var(--line); }

  /* ---------- Cart ---------- */
  main { padding: 12px 12px 200px; }
  .empty {
    text-align: center; color: var(--muted); padding: 40px 16px; font-size: 22px; line-height: 1.5;
  }
  .empty .big { font-size: 56px; display: block; margin-bottom: 8px; }
  .empty .ver { margin-top: 24px; font-size: 16px; color: #6b7280; }
  .item {
    background: var(--card); border-radius: 14px; padding: 12px 12px 14px;
    margin-bottom: 12px; border: 2px solid var(--line);
  }
  .item-top { display: flex; gap: 10px; align-items: flex-start; }
  .item-name { flex: 1; font-size: 24px; font-weight: 800; line-height: 1.25; word-break: break-word; }
  .item-unit { color: var(--muted); font-size: 19px; margin-top: 4px; }
  .item-unit s { color: #6b7280; }
  .item-unit .sale { color: var(--green); }
  .tag {
    display: inline-block; background: var(--green); color: #fff;
    font-size: 16px; font-weight: 800; padding: 2px 8px; border-radius: 8px; vertical-align: 2px;
  }
  .item-next { margin-top: 4px; font-size: 18px; color: var(--green); font-weight: 700; }

  /* Nhiều cách bán: 1 lon / 1 thùng */
  .sg-group { border-bottom: 2px solid var(--line); }
  .sg-group .sg-item { border-bottom: none; }
  .sg-units { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 12px 12px; }
  .sg-unit {
    min-height: 56px; padding: 4px 14px; border-radius: 12px;
    background: #eff6ff; color: var(--blue); border: 2px solid #93c5fd;
    font-size: 20px; font-weight: 800; line-height: 1.2;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .sg-unit:active { background: #dbeafe; }
  .sg-unit small { font-size: 16px; font-weight: 700; color: var(--red); }
  .item-unit.other { color: var(--blue); font-weight: 800; }
  .pl-unit { font-size: 18px; font-weight: 700; color: var(--blue); margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    min-height: 48px; padding: 0 16px; border-radius: 24px; background: #fff;
    border: 2px solid #93c5fd; color: var(--blue); font-size: 19px; font-weight: 800;
  }
  .chip:active { background: #dbeafe; }
  .btn-remove {
    width: 52px; height: 52px; flex-shrink: 0; border-radius: 12px;
    background: #fee2e2; color: var(--red-dark); font-size: 26px; font-weight: 900;
    border: 2px solid #fca5a5;
  }
  .item-bottom { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }
  .qty { display: flex; align-items: center; gap: 8px; }
  .btn-qty {
    width: 64px; height: 64px; border-radius: 14px;
    font-size: 36px; font-weight: 900; color: #fff; line-height: 1;
  }
  .btn-minus { background: #4b5563; }
  .btn-plus { background: var(--green); }
  .qty-num {
    min-width: 64px; height: 64px; padding: 0 6px; border-radius: 12px;
    background: #fff; border: 3px solid var(--ink);
    font-size: 30px; font-weight: 900; color: var(--ink);
  }
  .item-sub { font-size: 24px; font-weight: 900; color: var(--red); text-align: right; white-space: nowrap; }

  /* ---------- Footer ---------- */
  footer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
    background: #fff; border-top: 4px solid var(--red);
    padding: 10px 12px; padding-bottom: max(12px, env(safe-area-inset-bottom));
    box-shadow: 0 -4px 12px rgba(0,0,0,.15);
  }
  .total-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .total-label { font-size: 22px; font-weight: 800; }
  #total { font-size: 42px; font-weight: 900; color: var(--red); line-height: 1.1; }
  #itemCount { font-size: 17px; color: var(--muted); margin-bottom: 8px; }
  #btnNewOrder {
    width: 100%; min-height: 60px; border-radius: 14px;
    background: var(--ink); color: #fff; font-size: 22px; font-weight: 800;
  }

  /* ---------- Modal ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.6);
    display: none; align-items: flex-end; justify-content: center;
  }
  .overlay.open { display: flex; }
  .modal {
    width: 100%; max-width: 520px; background: #fff;
    border-radius: 20px 20px 0 0; padding: 20px 16px;
    padding-bottom: max(20px, env(safe-area-inset-bottom));
    max-height: 92vh; overflow-y: auto;
  }
  @media (min-width: 600px) { .overlay { align-items: center; } .modal { border-radius: 20px; } }
  .modal h2 { font-size: 26px; margin-bottom: 16px; }
  .modal p.msg {
    font-size: 22px; line-height: 1.45; margin-bottom: 20px;
    white-space: pre-line; max-height: 50vh; overflow-y: auto;
  }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-weight: 800; margin-bottom: 6px; font-size: 21px; }
  .field input {
    width: 100%; min-height: 62px; padding: 0 14px; font-size: 26px;
    border: 3px solid #6b7280; border-radius: 12px; outline: none;
  }
  .field input:focus { border-color: var(--blue); }
  .field input.invalid { border-color: var(--red); }
  .price-line { display: flex; gap: 8px; }
  .price-line input { flex: 1; min-width: 0; }
  .btn-000 {
    min-width: 84px; border-radius: 12px; background: #e5e7eb; color: var(--ink);
    font-size: 24px; font-weight: 800; border: 2px solid #9ca3af;
  }
  .hint { margin-top: 6px; font-size: 20px; color: var(--muted); }
  .hint b { color: var(--red); font-size: 22px; }
  .error { margin-top: 6px; font-size: 19px; color: var(--red); font-weight: 700; min-height: 0; }
  .modal-actions { display: flex; gap: 10px; margin-top: 8px; }
  .modal-actions button { flex: 1; min-height: 62px; border-radius: 14px; font-size: 22px; font-weight: 800; }
  .btn-cancel { background: #e5e7eb; color: var(--ink); }
  .btn-ok { background: var(--green); color: #fff; }
  .btn-danger { background: var(--red); color: #fff; }
  .opt { font-weight: 400; color: var(--muted); font-size: 18px; }
  .photo-row { display: flex; gap: 12px; align-items: center; }
  .photo-box {
    width: 116px; height: 116px; flex-shrink: 0; border-radius: 14px; overflow: hidden;
    border: 3px dashed #9ca3af; background: #f9fafb; color: #9ca3af;
    display: flex; align-items: center; justify-content: center; font-size: 44px;
  }
  .photo-box img { width: 100%; height: 100%; object-fit: cover; }
  .photo-btns { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .btn-photo {
    min-height: 50px; border-radius: 12px; background: var(--blue); color: #fff;
    font-size: 19px; font-weight: 800;
  }
  .btn-photo.alt { background: #e0e7ff; color: var(--blue); }
  .btn-photo-del {
    min-height: 44px; border-radius: 12px; background: #fff; color: var(--red);
    border: 2px solid #fca5a5; font-size: 17px; font-weight: 700;
  }
  .file-hidden { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .unit-card {
    background: #eff6ff; border: 2px solid #93c5fd; border-radius: 12px;
    padding: 10px; margin-bottom: 10px;
  }
  .unit-card.main { background: #f9fafb; border-color: #9ca3af; }
  .unit-card input {
    width: auto; flex: 1; min-width: 0; min-height: 54px; padding: 0 10px; font-size: 24px;
    border: 3px solid #6b7280; border-radius: 10px; outline: none; background: #fff;
  }
  .unit-card .btn-000 { min-width: 76px; min-height: 54px; }
  .add-unit-label { font-size: 19px; font-weight: 700; margin: 4px 0 8px; }
  .tier-row {
    background: #f0fdf4; border: 2px solid #86efac; border-radius: 12px; padding: 10px;
  }
  .tier-line { display: flex; align-items: center; gap: 8px; font-size: 20px; }
  .tier-line + .tier-line { margin-top: 8px; }
  .tier-row input {
    width: auto; min-height: 54px; padding: 0 10px; font-size: 24px;
    border: 3px solid #6b7280; border-radius: 10px; outline: none; background: #fff;
  }
  .tier-row input:focus { border-color: var(--blue); }
  .tier-row input.invalid { border-color: var(--red); }
  .tier-row .tier-min { width: 72px; text-align: center; }
  .tier-row .tier-price { flex: 1; min-width: 0; }
  .tier-del {
    width: 50px; height: 50px; flex-shrink: 0; border-radius: 10px;
    background: #fee2e2; color: var(--red-dark); border: 2px solid #fca5a5;
    font-size: 22px; font-weight: 900;
  }
  .btn-delete {
    width: 100%; margin-top: 14px; min-height: 56px; border-radius: 14px;
    background: #fff; color: var(--red); border: 2px solid var(--red);
    font-size: 20px; font-weight: 800;
  }

  /* ---------- Màn hình sửa giá ---------- */
  .screen {
    position: fixed; inset: 0; z-index: 40; background: var(--bg);
    display: none; flex-direction: column;
  }
  .screen.open { display: flex; }
  .screen-head {
    background: var(--blue); padding: 10px 12px 12px;
    padding-top: max(10px, env(safe-area-inset-top));
  }
  .screen-title-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .screen-title-row h2 { flex: 1; color: #fff; font-size: 24px; }
  .btn-close {
    background: #fff; color: var(--ink); font-weight: 800; font-size: 20px;
    min-height: 54px; padding: 0 16px; border-radius: 12px;
  }
  .screen-body {
    flex: 1; overflow-y: auto; padding: 12px;
    padding-bottom: max(24px, env(safe-area-inset-bottom));
  }
  .pl-tip { font-size: 18px; color: var(--muted); margin-bottom: 10px; }
  .pl-item {
    width: 100%; display: flex; align-items: center; gap: 10px;
    background: #fff; border: 2px solid var(--line); border-radius: 14px;
    padding: 12px; margin-bottom: 10px; text-align: left; min-height: 76px; color: var(--ink);
  }
  .pl-item:active { background: #eff6ff; }
  .pl-info { flex: 1; min-width: 0; }
  .pl-name { font-size: 22px; font-weight: 700; line-height: 1.25; word-break: break-word; }
  .pl-name mark { background: #fde047; color: inherit; border-radius: 3px; }
  .pl-price { font-size: 22px; font-weight: 900; color: var(--red); margin-top: 2px; }
  .pl-tiers { font-size: 17px; font-weight: 700; color: var(--green); margin-top: 2px; }
  .sample-box {
    background: #fffbeb; border: 2px solid #fcd34d; border-radius: 14px;
    padding: 12px; margin-bottom: 12px; font-size: 20px; line-height: 1.4;
  }
  .btn-samples {
    width: 100%; min-height: 56px; margin-top: 10px; border-radius: 12px;
    background: #fff; color: var(--ink); border: 2px solid #f59e0b;
    font-size: 20px; font-weight: 800;
  }
  .pl-edit {
    flex-shrink: 0; background: var(--blue); color: #fff; font-size: 19px; font-weight: 800;
    padding: 12px 14px; border-radius: 12px;
  }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed; left: 50%; bottom: 190px; transform: translateX(-50%);
    z-index: 60; background: var(--ink); color: #fff; padding: 14px 20px;
    border-radius: 12px; font-size: 20px; font-weight: 700; max-width: 90vw; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="head-row">
    <button class="btn-head" id="btnOpenList">✏️ Sửa giá</button>
    <button class="btn-head" id="btnOpenAdd">➕ Thêm món</button>
  </div>
  <div class="search-wrap">
    <input id="search" class="big-search" type="search" placeholder="🔍 Gõ tên món..." autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
    <button id="clearSearch" aria-label="Xóa chữ">✕</button>
    <div id="suggest" role="listbox"></div>
  </div>
</header>

<main id="cart"></main>

<footer>
  <div class="total-row">
    <span class="total-label">Tổng cộng:</span>
    <span id="total">0đ</span>
  </div>
  <div id="itemCount">Chưa có món nào</div>
  <button id="btnNewOrder">🗑️ Xóa &amp; Tạo đơn mới</button>
</footer>

<!-- Màn hình sửa giá -->
<div class="screen" id="listScreen">
  <div class="screen-head">
    <div class="screen-title-row">
      <h2>✏️ Sửa giá món</h2>
      <button class="btn-close" id="btnCloseList">✕ Đóng</button>
    </div>
    <input id="plSearch" class="big-search" type="search" placeholder="🔍 Tìm món cần sửa..." autocomplete="off" autocorrect="off" spellcheck="false">
  </div>
  <div class="screen-body" id="plList"></div>
</div>

<!-- Popup thêm / sửa món -->
<div class="overlay" id="addModal">
  <div class="modal" role="dialog" aria-labelledby="addTitle">
    <h2 id="addTitle">➕ Thêm món mới</h2>
    <div class="field">
      <label>Ảnh sản phẩm <span class="opt">(không bắt buộc)</span></label>
      <div class="photo-row">
        <div class="photo-box" id="photoBox">📷</div>
        <div class="photo-btns">
          <button class="btn-photo" id="btnPhotoCam" type="button">📷 Chụp ảnh</button>
          <button class="btn-photo alt" id="btnPhotoPick" type="button">🖼️ Chọn ảnh có sẵn</button>
          <button class="btn-photo-del" id="btnPhotoDel" type="button">🗑️ Bỏ ảnh</button>
        </div>
      </div>
      <input class="file-hidden" id="photoCam" type="file" accept="image/*" capture="environment" tabindex="-1">
      <input class="file-hidden" id="photoPick" type="file" accept="image/*" tabindex="-1">
    </div>
    <div class="field">
      <label for="newName">Tên sản phẩm</label>
      <input id="newName" type="text" autocomplete="off" placeholder="Ví dụ: Bánh mì sandwich">
      <div class="error" id="nameError"></div>
    </div>
    <div class="field">
      <label>Giá bán</label>
      <div class="unit-card main">
        <div class="tier-line">1
          <input id="mainUnit" class="unit-name" type="text" autocomplete="off" placeholder="lon, gói, chai…">
        </div>
        <div class="tier-line">giá
          <input id="newPrice" class="unit-price" type="text" inputmode="numeric" autocomplete="off" placeholder="Ví dụ: 15.000">
          <button class="btn-000" type="button">000</button>
        </div>
      </div>
      <div class="hint" id="priceHint"></div>
      <div class="error" id="priceError"></div>
      <div id="unitRows"></div>
      <div class="error" id="unitError"></div>
      <div class="add-unit-label">➕ Bán thêm theo:</div>
      <div class="chips" id="unitChips">
        <button class="chip" type="button">thùng</button>
        <button class="chip" type="button">hộp</button>
        <button class="chip" type="button">dây</button>
        <button class="chip" type="button">lốc</button>
        <button class="chip" type="button">két</button>
        <button class="chip" type="button">bịch</button>
        <button class="chip" type="button">vỉ</button>
        <button class="chip" type="button" data-other="1">khác…</button>
      </div>
    </div>
    <div class="field">
      <label>Giá sỉ khi mua nhiều <span class="opt">(để trống nếu không có)</span></label>
      <div class="tier-row">
        <div class="tier-line">Mua từ
          <input id="bulkMin" class="tier-min" type="text" inputmode="numeric" autocomplete="off">
          <span class="bulk-unit">cái</span> trở lên</div>
        <div class="tier-line">giá
          <input id="bulkPrice" class="tier-price" type="text" inputmode="numeric" autocomplete="off" placeholder="Giá sỉ">
          đ / <span class="bulk-unit">cái</span>
          <button class="tier-del" id="btnClearBulk" type="button" aria-label="Bỏ giá sỉ">✕</button></div>
      </div>
      <div class="hint" id="bulkHint"></div>
      <div class="error" id="bulkError"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="btnCancelAdd">Hủy</button>
      <button class="btn-ok" id="btnSaveAdd">💾 Lưu</button>
    </div>
    <button class="btn-delete" id="btnDeleteProduct">🗑️ Xóa món này khỏi danh sách</button>
  </div>
</div>

<!-- Popup nhập số lượng -->
<div class="overlay" id="qtyModal">
  <div class="modal" role="dialog" aria-labelledby="qtyTitle">
    <h2 id="qtyTitle">Nhập số lượng</h2>
    <div class="field">
      <label for="qtyInput" id="qtyLabel"></label>
      <input id="qtyInput" type="text" inputmode="numeric" autocomplete="off">
      <div class="hint" id="qtyHint"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="btnCancelQty">Hủy</button>
      <button class="btn-ok" id="btnSaveQty">✔ Xong</button>
    </div>
  </div>
</div>

<!-- Popup xác nhận -->
<div class="overlay" id="confirmModal">
  <div class="modal" role="alertdialog">
    <h2 id="confirmTitle"></h2>
    <p class="msg" id="confirmMsg"></p>
    <div class="modal-actions">
      <button class="btn-cancel" id="btnConfirmNo">Không</button>
      <button class="btn-danger" id="btnConfirmYes">Đồng ý</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(function () {
  'use strict';

  var APP_VERSION = 9; // tăng cùng với CACHE trong sw.js mỗi lần sửa app
  var KEY_PRODUCTS = 'taphoa_products';
  var KEY_CART = 'taphoa_cart';

  // 20 món mẫu cài sẵn ở các bản trước. Máy mới không còn được thêm sẵn các món này;
  // danh sách chỉ giữ lại để nhận ra món mẫu chưa sửa khi bấm "Xóa các món mẫu".
  var FIRST_USER_ID = 21; // món chủ tiệm tự thêm luôn mang số từ 21 trở đi
  var SAMPLE_PRODUCTS = [
    { id: 1,  name: 'Mì Hảo Hảo (gói)',            price: 4500 },
    { id: 2,  name: 'Nước mắm Nam Ngư 500ml',      price: 38000 },

  // ---------- Lưu trữ ----------
  function load(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }

  // Món hàng: { id, name, price, unit?, units?: [{ name, price }], bulkMin?, bulkPrice? }
  //   price/unit = cách bán chính (vd 1 lon 15.000), units = cách bán khác (vd 1 thùng 340.000)
  var products = load(KEY_PRODUCTS, null);
  if (!Array.isArray(products)) {
    products = [];
    save(KEY_PRODUCTS, products);
  }
  // Bản 8 lưu "1 dây = 12 cái"; đổi sang "1 dây = <giá cả dây>" để không mất dữ liệu đã nhập
  var migrated = false;
  products.forEach(function (p) {
    if (!('packName' in p) && !('packSize' in p)) return;
    if (p.packName && p.packSize >= 2) {
      p.units = (p.units || []).concat([{ name: p.packName, price: unitPrice(p, p.packSize) * p.packSize }]);
    }
    delete p.packName;
    delete p.packSize;
    migrated = true;
  });
  if (migrated) save(KEY_PRODUCTS, products);

  // Giỏ hàng: [{ id, qty, unit? }] — unit trống là cách bán chính, có tên là cách bán khác
  var cart = load(KEY_CART, []);
  if (!Array.isArray(cart)) cart = [];
  pruneCart();

  // Bỏ các dòng trong giỏ mà món hoặc cách bán đã bị xóa/đổi tên
  function pruneCart() {
    cart = cart.filter(function (c) {
      var p = findProduct(c.id);
      return p && c.qty > 0 && (!c.unit || findUnit(p, c.unit));
    });
  }

  // ---------- Tiện ích ----------
  var money = new Intl.NumberFormat('vi-VN');
  function fmt(n) { return money.format(n) + 'đ'; }

  // Bỏ dấu tiếng Việt, đổi về chữ thường: "Sữa" -> "sua"
  function plain(s) {
    return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase().trim();
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function digitsOnly(s) { return String(s).replace(/\D/g, ''); }
  function findProduct(id) {
    for (var i = 0; i < products.length; i++) if (products[i].id === id) return products[i];
    return null;
  }
  function $(id) { return document.getElementById(id); }

  // ---------- Ảnh món hàng (lưu trong IndexedDB vì localStorage quá nhỏ) ----------
  var photos = {}; // id món -> ảnh dạng data URL
  var dbPromise = null;
  function openDb() {
    if (!dbPromise) dbPromise = new Promise(function (resolve, reject) {
      if (!window.indexedDB) { reject(new Error('Không có IndexedDB')); return; }
      var req = indexedDB.open('taphoa', 1);
      req.onupgradeneeded = function () { req.result.createObjectStore('photos'); };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
    return dbPromise;
  }
  function photoWrite(fn) {
    return openDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction('photos', 'readwrite');
        fn(tx.objectStore('photos'));
        tx.oncomplete = resolve;
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }
  function loadAllPhotos() {
    return openDb().then(function (db) {
      return new Promise(function (resolve) {
        var req = db.transaction('photos', 'readonly').objectStore('photos').openCursor();
        req.onsuccess = function () {
          var cur = req.result;
          if (cur) { photos[cur.key] = cur.value; cur.continue(); } else resolve();
        };
        req.onerror = function () { resolve(); };
      });
    });
  }
  function savePhoto(id, dataUrl) {
    photos[id] = dataUrl;
    // Xin trình duyệt giữ dữ liệu lâu dài, không tự dọn khi máy đầy
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
    photoWrite(function (s) { s.put(dataUrl, id); })
      .catch(function () { toast('⚠️ Không lưu được ảnh, máy có thể đã đầy bộ nhớ'); });
  }
  function deletePhoto(id) {
    delete photos[id];
    photoWrite(function (s) { s.delete(id); }).catch(function () {});
  }

  // Thu nhỏ ảnh còn 400×400, giữ nguyên cả món (nền trắng), nén JPEG ~25KB
  function resizePhoto(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var size = 400;
        var scale = size / Math.max(img.naturalWidth, img.naturalHeight);
        var w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
        var c = document.createElement('canvas');
        c.width = c.height = size;
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, size, size);
        ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('Ảnh lỗi')); };
      img.src = url;
    });
  }

  // Ảnh nhỏ cạnh tên món. withPlaceholder: món chưa có ảnh thì hiện ô xám để thẳng hàng
  function thumbHtml(p, withPlaceholder) {
    if (photos[p.id]) return '<img class="thumb" alt="" src="' + photos[p.id] + '">';
    return withPlaceholder ? '<span class="thumb thumb-empty">📦</span>' : '';
  }

  // Giá sỉ: mua từ bulkMin cái trở lên thì tất cả các cái tính giá bulkPrice
  function hasBulk(p) { return p.bulkPrice > 0 && p.bulkMin >= 2; }
  function unitPrice(p, qty) { return hasBulk(p) && qty >= p.bulkMin ? p.bulkPrice : p.price; }

  // Nhiều cách bán: 1 lon / 1 thùng, mỗi cách một giá riêng do chủ tiệm ghi
  function mainUnitName(p) { return p.unit || 'cái'; }
  function otherUnits(p) { return p.units || []; }
  function findUnit(p, name) {
    return otherUnits(p).find(function (u) { return u.name === name; }) || null;
  }
  // Giá 1 đơn vị của một dòng trong giỏ (cách bán chính thì có thể được giá sỉ)
  function linePrice(p, unit, qty) {
    if (unit) { var u = findUnit(p, unit); return u ? u.price : 0; }
    return unitPrice(p, qty);
  }
  function sameLine(c, id, unit) { return c.id === id && (c.unit || '') === (unit || ''); }

  var toastTimer;
  function toast(text) {
    var t = $('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }

  // ---------- Tìm kiếm ----------
  var searchEl = $('search');
  var suggestEl = $('suggest');
  var clearBtn = $('clearSearch');

  // Tô vàng phần chữ khớp (so khớp trên chuỗi không dấu, vị trí tương ứng 1-1 với tên gốc)
  function highlight(name, query) {
    var p = plain(name);
    var idx = p.indexOf(query);
    if (idx < 0 || p.length !== name.length) return escapeHtml(name);
    return escapeHtml(name.slice(0, idx)) + '<mark>' +
      escapeHtml(name.slice(idx, idx + query.length)) + '</mark>' +
      escapeHtml(name.slice(idx + query.length));
  }

  function searchProducts(q) {
    var words = q.split(/\s+/).filter(Boolean);
    var results = [];
    products.forEach(function (p) {
      var name = plain(p.name);
      // Mọi chữ gõ vào đều phải có trong tên
      for (var i = 0; i < words.length; i++) if (name.indexOf(words[i]) < 0) return;
      // Ưu tiên: tên bắt đầu bằng chữ gõ > một từ bắt đầu bằng chữ gõ > chứa ở giữa
      var score = name.indexOf(q) === 0 ? 0
        : (' ' + name).indexOf(' ' + words[0]) >= 0 ? 1 : 2;
      results.push({ p: p, score: score });
    });
    results.sort(function (a, b) {
      return a.score - b.score || a.p.name.localeCompare(b.p.name, 'vi');
    });
    return results.map(function (r) { return r.p; });
  }

  function renderSuggest() {
    var raw = searchEl.value;
    var q = plain(raw).replace(/\s+/g, ' ');
    clearBtn.style.display = raw ? 'block' : 'none';
    if (!q) { suggestEl.style.display = 'none'; suggestEl.innerHTML = ''; return; }

    var list = searchProducts(q);
    var html = '<div class="sg-count">' +
      (list.length ? 'Tìm thấy ' + list.length + ' món' : 'Không có món nào khớp') + '</div>';
    list.forEach(function (p) {
      var units = otherUnits(p);
      if (!units.length) {
        html += '<button class="sg-item" data-id="' + p.id + '">' + thumbHtml(p, true) +
          '<span class="sg-info"><span>' + highlight(p.name, q) + '</span>' +
          '<span class="sg-price">' + fmt(p.price) + ' / ' + escapeHtml(mainUnitName(p)) + '</span></span></button>';
        return;
      }
      // Món có nhiều cách bán: mỗi cách một nút (+1 lon, +1 thùng…), chạm dòng tên = cách bán chính
      html += '<div class="sg-group"><button class="sg-item" data-id="' + p.id + '">' + thumbHtml(p, true) +
        '<span class="sg-info"><span>' + highlight(p.name, q) + '</span></span></button>' +
        '<div class="sg-units">' + unitButton(p, '', p.price) +
        units.map(function (u) { return unitButton(p, u.name, u.price); }).join('') + '</div></div>';
    });
    html += '<button class="sg-item sg-new" data-new="1">➕ Thêm "' +
      escapeHtml(raw.trim()) + '" làm món mới</button>';
    suggestEl.innerHTML = html;
    suggestEl.style.display = 'block';
    suggestEl.scrollTop = 0;
  }

  function unitButton(p, unit, price) {
    return '<button class="sg-unit" data-id="' + p.id + '" data-unit="' + escapeHtml(unit) + '">+1 ' +
      escapeHtml(unit || mainUnitName(p)) + '<small>' + fmt(price) + '</small></button>';
  }

  function clearSearch() {
    searchEl.value = '';
    renderSuggest();
  }

  searchEl.addEventListener('input', renderSuggest);
  searchEl.addEventListener('focus', renderSuggest);
  clearBtn.addEventListener('click', function () { clearSearch(); searchEl.focus(); });

  suggestEl.addEventListener('click', function (e) {
    var uBtn = e.target.closest('.sg-unit');
    if (uBtn) {
      addToCart(Number(uBtn.dataset.id), 1, uBtn.dataset.unit);
      clearSearch();
      searchEl.blur();
      return;
    }
    var btn = e.target.closest('.sg-item');
    if (!btn) return;
    if (btn.dataset.new) {
      var name = searchEl.value.trim();
      clearSearch();
      searchEl.blur();
      openAddModal(name, true);
      return;
    }
    addToCart(Number(btn.dataset.id));
    clearSearch();
    searchEl.blur();
  });

  // Chạm ra ngoài thì ẩn gợi ý
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.search-wrap')) suggestEl.style.display = 'none';
  });

  // ---------- Giỏ hàng ----------
  var cartEl = $('cart');

  // unit: '' = cách bán chính (vd lon), có tên = cách bán khác (vd thùng)
  function addToCart(id, qty, unit) {
    var p = findProduct(id);
    if (!p) return;
    unit = unit || '';
    var line = cart.find(function (c) { return sameLine(c, id, unit); });
    var oldQty = line ? line.qty : 0;
    if (line) {
      line.qty += qty || 1;
      // Đưa món vừa chọn lên đầu cho dễ thấy
      cart.splice(cart.indexOf(line), 1);
      cart.unshift(line);
    } else {
      line = { id: id, qty: qty || 1 };
      if (unit) line.unit = unit;
      cart.unshift(line);
    }
    commitCart();
    toast('Đã thêm: ' + p.name + ' — ' + line.qty + ' ' + (unit || mainUnitName(p)) +
      (unit ? '' : bulkNote(p, oldQty, line.qty)));
  }

  function setQty(id, unit, qty) {
    var line = cart.find(function (c) { return sameLine(c, id, unit); });
    if (!line) return;
    var p = findProduct(id), oldQty = line.qty;
    if (qty <= 0) cart.splice(cart.indexOf(line), 1);
    else line.qty = qty;
    commitCart();
    var note = qty > 0 && !unit ? bulkNote(p, oldQty, qty) : '';
    if (note) toast(note.replace(/^ · /, ''));
  }

  // Báo khi vừa đủ số lượng để được giá sỉ
  function bulkNote(p, oldQty, newQty) {
    var before = oldQty > 0 ? unitPrice(p, oldQty) : p.price;
    var after = unitPrice(p, newQty);
    return after < before ? ' · 🏷️ Giá sỉ ' + fmt(after) + ' / ' + mainUnitName(p) : '';
  }

  function commitCart() {
    save(KEY_CART, cart);
    renderCart();
  }

  function renderCart() {
    var total = 0, count = 0;
    if (!cart.length) {
      cartEl.innerHTML = '<div class="empty"><span class="big">🛒</span>' +
        'Chưa có món nào.<br>Gõ tên món vào ô tìm kiếm phía trên.' +
        '<div class="ver">Phiên bản ' + APP_VERSION + '</div></div>';
    } else {
      var html = '';
      cart.forEach(function (c) {
        var p = findProduct(c.id);
        var price = linePrice(p, c.unit, c.qty);
        var sub = price * c.qty;
        total += sub; count += c.qty;
        var unitName = escapeHtml(c.unit || mainUnitName(p));
        var unitHtml;
        if (c.unit) {
          unitHtml = '<div class="item-unit other">' + fmt(price) + ' / ' + unitName + '</div>';
        } else if (price < p.price) {
          unitHtml = '<div class="item-unit"><s>' + fmt(p.price) + '</s> <b class="sale">' + fmt(price) +
            ' / ' + unitName + '</b> <span class="tag">🏷️ Giá sỉ</span></div>';
        } else {
          unitHtml = '<div class="item-unit">' + fmt(p.price) + ' / ' + unitName + '</div>' +
            (hasBulk(p) ? '<div class="item-next">Mua từ ' + p.bulkMin + ': ' + fmt(p.bulkPrice) + ' / ' + unitName + '</div>' : '');
        }
        var key = 'data-id="' + c.id + '" data-unit="' + escapeHtml(c.unit || '') + '"';
        html += '<div class="item">' +
          '<div class="item-top">' + thumbHtml(p, false) +
            '<div style="flex:1;min-width:0"><div class="item-name">' + escapeHtml(p.name) + '</div>' +
            unitHtml + '</div>' +
            '<button class="btn-remove" data-act="remove" ' + key + ' aria-label="Bỏ món">✕</button>' +
          '</div>' +
          '<div class="item-bottom">' +
            '<div class="qty">' +
              '<button class="btn-qty btn-minus" data-act="minus" ' + key + ' aria-label="Bớt">−</button>' +
              '<button class="qty-num" data-act="type" ' + key + ' aria-label="Nhập số lượng">' + c.qty + '</button>' +
              '<button class="btn-qty btn-plus" data-act="plus" ' + key + ' aria-label="Thêm">+</button>' +
            '</div>' +
            '<div class="item-sub">' + fmt(sub) + '</div>' +
          '</div></div>';
      });
      cartEl.innerHTML = html;
    }
    $('total').textContent = fmt(total);
    $('itemCount').textContent = cart.length
      ? cart.length + ' loại món · ' + count + ' sản phẩm'
      : 'Chưa có món nào';
  }

  cartEl.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-act]');
    if (!btn) return;
    var id = Number(btn.dataset.id), unit = btn.dataset.unit || '';
    var line = cart.find(function (c) { return sameLine(c, id, unit); });
    if (!line) return;
    var act = btn.dataset.act;
    if (act === 'plus') setQty(id, unit, line.qty + 1);
    else if (act === 'minus') setQty(id, unit, line.qty - 1);
    else if (act === 'remove') setQty(id, unit, 0);
    else if (act === 'type') openQtyModal(id, unit);
  });

  // ---------- Popup chung ----------
  function openModal(el) { el.classList.add('open'); }
  function closeModal(el) { el.classList.remove('open'); reloadIfIdle(); }

  // Có bản mới thì tải lại, nhưng chờ đến khi không còn popup đang nhập dở
  var pendingReload = false;
  function reloadIfIdle() {
    if (!pendingReload || document.querySelector('.overlay.open, .screen.open')) return;
    pendingReload = false;
    location.reload();
  }
  document.querySelectorAll('.overlay').forEach(function (ov) {
    ov.addEventListener('click', function (e) { if (e.target === ov) closeModal(ov); });
  });

  // ---------- Xác nhận ----------
  var confirmModal = $('confirmModal');
  var onConfirmYes = null;
  function askConfirm(title, msg, yesLabel, onYes) {
    $('confirmTitle').textContent = title;
    $('confirmMsg').textContent = msg;
    $('btnConfirmYes').textContent = yesLabel;
    onConfirmYes = onYes;
    openModal(confirmModal);
  }
  $('btnConfirmNo').addEventListener('click', function () { closeModal(confirmModal); });
  $('btnConfirmYes').addEventListener('click', function () {
    var fn = onConfirmYes;
    onConfirmYes = null;
    closeModal(confirmModal);
    if (fn) fn();
  });

  // ---------- Màn hình sửa giá ----------
  var listScreen = $('listScreen'), plSearchEl = $('plSearch'), plListEl = $('plList');

  function renderProductList() {
    var q = plain(plSearchEl.value).replace(/\s+/g, ' ');
    var list = q ? searchProducts(q) : products.slice().sort(function (a, b) {
      return a.name.localeCompare(b.name, 'vi');
    });
    var html = '<div class="pl-tip">' + products.length + ' món · Chạm vào món để sửa giá · Phiên bản ' + APP_VERSION + '</div>';
    var samples = untouchedSamples();
    if (samples.length && !q) {
      html += '<div class="sample-box">Còn <b>' + samples.length + ' món mẫu</b> do app cài sẵn.' +
        '<button class="btn-samples" id="btnDelSamples">🧹 Xóa các món mẫu</button></div>';
    }
    if (!products.length) html += '<div class="empty">Chưa có món nào.<br>Bấm "➕ Thêm món" để thêm.</div>';
    else if (!list.length) html += '<div class="empty">Không có món nào khớp.</div>';
    list.forEach(function (p) {
      html += '<button class="pl-item" data-id="' + p.id + '">' + thumbHtml(p, true) +
        '<div class="pl-info"><div class="pl-name">' + (q ? highlight(p.name, q) : escapeHtml(p.name)) + '</div>' +
        '<div class="pl-price">' + fmt(p.price) + ' / ' + escapeHtml(mainUnitName(p)) + '</div>' +
        otherUnits(p).map(function (u) {
          return '<div class="pl-unit">📦 1 ' + escapeHtml(u.name) + ': ' + fmt(u.price) + '</div>';
        }).join('') +
        (hasBulk(p) ? '<div class="pl-tiers">🏷️ Từ ' + p.bulkMin + ' ' + escapeHtml(mainUnitName(p)) + ': ' + fmt(p.bulkPrice) + '</div>' : '') +
        '</div>' +
        '<span class="pl-edit">✏️ Sửa</span></button>';
    });
    plListEl.innerHTML = html;
  }

  function openListScreen() {
    plSearchEl.value = '';
    renderProductList();
    listScreen.classList.add('open');
    plListEl.scrollTop = 0;
    document.body.style.overflow = 'hidden';
  }
  function closeListScreen() {
    listScreen.classList.remove('open');
    document.body.style.overflow = '';
    reloadIfIdle();
  }

  $('btnOpenList').addEventListener('click', openListScreen);
  $('btnCloseList').addEventListener('click', closeListScreen);
  plSearchEl.addEventListener('input', renderProductList);
  plListEl.addEventListener('click', function (e) {
    if (e.target.closest('#btnDelSamples')) { deleteSamples(); return; }
    var btn = e.target.closest('.pl-item');
    if (btn) openEditModal(Number(btn.dataset.id));
  });

  // Món mẫu còn nguyên như lúc cài (chưa sửa tên, giá, chưa đặt giá sỉ)
  function untouchedSamples() {
    return products.filter(function (p) {
      var s = SAMPLE_PRODUCTS.find(function (x) { return x.id === p.id; });
      return s && s.name === p.name && s.price === p.price && !hasBulk(p) && !p.unit && !otherUnits(p).length && !photos[p.id];
    });
  }

  function deleteSamples() {
    var samples = untouchedSamples();
    if (!samples.length) return;
    var kept = products.filter(function (p) { return p.id < FIRST_USER_ID && samples.indexOf(p) < 0; });
    var own = products.filter(function (p) { return p.id >= FIRST_USER_ID; });
    var msg = 'Sẽ xóa ' + samples.length + ' món mẫu:\n' +
      samples.map(function (p) { return '• ' + p.name; }).join('\n');
    if (kept.length) {
      msg += '\n\nGiữ lại ' + kept.length + ' món mẫu bạn đã sửa:\n' +
        kept.map(function (p) { return '• ' + p.name; }).join('\n');
    }
    msg += '\n\nGiữ nguyên ' + own.length + ' món bạn tự thêm.';
    askConfirm('🧹 Xóa các món mẫu?', msg, 'Xóa món mẫu', function () {
      var ids = samples.map(function (p) { return p.id; });
      products = products.filter(function (p) { return ids.indexOf(p.id) < 0; });
      cart = cart.filter(function (c) { return ids.indexOf(c.id) < 0; });
      ids.forEach(function (id) { if (photos[id]) deletePhoto(id); });
      save(KEY_PRODUCTS, products);
      commitCart();
      renderProductList();
      toast('Đã xóa ' + ids.length + ' món mẫu');
    });
  }

  // ---------- Thêm / sửa món ----------
  var addModal = $('addModal');
  var nameIn = $('newName'), priceIn = $('newPrice');
  var mainUnitIn = $('mainUnit'), unitRowsEl = $('unitRows');
  var bulkMinIn = $('bulkMin'), bulkPriceIn = $('bulkPrice');
  var addToCartAfterSave = false;
  var editingId = null; // null = đang thêm món mới
  var pendingPhoto;     // undefined = giữ ảnh cũ, null = bỏ ảnh, chuỗi = ảnh mới chụp

  function currentPhoto() {
    if (pendingPhoto !== undefined) return pendingPhoto;
    return editingId !== null ? photos[editingId] || null : null;
  }
  function showPhotoPreview() {
    var src = currentPhoto(), box = $('photoBox');
    box.textContent = '';
    if (src) {
      var img = document.createElement('img');
      img.alt = '';
      img.src = src;
      box.appendChild(img);
    } else box.textContent = '📷';
    $('btnPhotoDel').style.display = src ? 'block' : 'none';
  }
  function onPhotoPicked(e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    $('photoBox').textContent = '⏳';
    resizePhoto(file).then(function (dataUrl) {
      pendingPhoto = dataUrl;
      showPhotoPreview();
    }).catch(function () {
      showPhotoPreview();
      toast('Không đọc được ảnh này, thử ảnh khác');
    });
  }
  function applyPhoto(id) {
    if (pendingPhoto === null) deletePhoto(id);
    else if (pendingPhoto) savePhoto(id, pendingPhoto);
  }
  $('btnPhotoCam').addEventListener('click', function () { $('photoCam').click(); });
  $('btnPhotoPick').addEventListener('click', function () { $('photoPick').click(); });
  $('photoCam').addEventListener('change', onPhotoPicked);
  $('photoPick').addEventListener('change', onPhotoPicked);
  $('btnPhotoDel').addEventListener('click', function () { pendingPhoto = null; showPhotoPreview(); });

  function updatePriceHint() {
    var d = digitsOnly(priceIn.value).replace(/^0+/, '');
    priceIn.value = d ? money.format(Number(d)) : '';
    var old = editingId !== null && findProduct(editingId);
    // Chỉ nhắc giá cũ khi đã gõ giá khác, cho gọn
    $('priceHint').innerHTML = old && d && Number(d) !== old.price ? 'Giá cũ: ' + fmt(old.price) : '';
    updateBulkHint();
  }

  // Ví dụ cụ thể để chủ tiệm thấy ngay khách sẽ trả bao nhiêu
  function updateBulkHint() {
    var bm = Number(digitsOnly(bulkMinIn.value)) || 0;
    var bd = digitsOnly(bulkPriceIn.value).replace(/^0+/, '');
    bulkMinIn.value = bm ? String(bm) : '';
    bulkPriceIn.value = bd ? money.format(Number(bd)) : '';
    var price = Number(digitsOnly(priceIn.value));
    var bp = Number(bd);
    var un = mainUnitIn.value.trim() || 'cái';
    document.querySelectorAll('.bulk-unit').forEach(function (el) { el.textContent = un; });
    $('bulkHint').innerHTML = bm >= 2 && bp > 0 && price > bp
      ? 'Khách mua ' + bm + ' ' + escapeHtml(un) + ': <b>' + fmt(bp * bm) + '</b> (giá lẻ là ' + fmt(price * bm) + ')'
      : '';
  }
  bulkMinIn.addEventListener('input', updateBulkHint);
  bulkPriceIn.addEventListener('input', updateBulkHint);
  mainUnitIn.addEventListener('input', updateBulkHint);
  $('btnClearBulk').addEventListener('click', function () {
    bulkMinIn.value = '2';
    bulkPriceIn.value = '';
    updateBulkHint();
  });

  // Cách bán khác: 1 thùng, 1 hộp… mỗi dòng ghi thẳng một giá
  var MAX_UNITS = 5;
  function addUnitRow(name, price) {
    if (unitRowsEl.children.length >= MAX_UNITS) {
      toast('Tối đa ' + MAX_UNITS + ' cách bán khác');
      return null;
    }
    var row = document.createElement('div');
    row.className = 'unit-card';
    row.innerHTML =
      '<div class="tier-line">1 <input class="unit-name" type="text" autocomplete="off" placeholder="thùng, hộp…">' +
      '<button class="tier-del" type="button" aria-label="Bỏ cách bán này">✕</button></div>' +
      '<div class="tier-line">giá <input class="unit-price" type="text" inputmode="numeric" autocomplete="off" placeholder="Giá">' +
      '<button class="btn-000" type="button">000</button></div>';
    row.querySelector('.unit-name').value = name || '';
    row.querySelector('.unit-price').value = price ? money.format(price) : '';
    unitRowsEl.appendChild(row);
    return row;
  }
  $('unitChips').addEventListener('click', function (e) {
    var ch = e.target.closest('.chip');
    if (!ch) return;
    var row = addUnitRow(ch.dataset.other ? '' : ch.textContent.trim(), 0);
    if (row) row.querySelector(ch.dataset.other ? '.unit-name' : '.unit-price').focus();
  });
  unitRowsEl.addEventListener('click', function (e) {
    var del = e.target.closest('.tier-del');
    if (del) del.closest('.unit-card').remove();
  });
  unitRowsEl.addEventListener('input', function (e) {
    if (!e.target.classList.contains('unit-price')) return;
    var d = digitsOnly(e.target.value).replace(/^0+/, '');
    e.target.value = d ? money.format(Number(d)) : '';
  });
  // Nút 000 cạnh mỗi ô giá: gõ 15 rồi bấm 000 thành 15.000
  addModal.addEventListener('click', function (e) {
    var b = e.target.closest('.btn-000');
    if (!b) return;
    var input = b.parentNode.querySelector('input');
    var d = digitsOnly(input.value);
    if (d && d.length < 10) {
      input.value = d + '000';
      input.dispatchEvent(new Event('input', { bubbles: true }));
    }
    input.focus();
  });

  function openProductModal(product, prefillName, thenAddToCart) {
    editingId = product ? product.id : null;
    pendingPhoto = undefined;
    showPhotoPreview();
    addToCartAfterSave = !!thenAddToCart;
    $('addTitle').textContent = product ? '✏️ Sửa món' : '➕ Thêm món mới';
    $('btnDeleteProduct').style.display = product ? 'block' : 'none';
    nameIn.value = product ? product.name : (prefillName || '');
    priceIn.value = product ? String(product.price) : '';
    var bulk = product && hasBulk(product);
    bulkMinIn.value = bulk ? String(product.bulkMin) : '2';
    bulkPriceIn.value = bulk ? String(product.bulkPrice) : '';
    mainUnitIn.value = product && product.unit ? product.unit : '';
    unitRowsEl.innerHTML = '';
    if (product) otherUnits(product).forEach(function (u) { addUnitRow(u.name, u.price); });
    updatePriceHint();
    ['nameError', 'priceError', 'bulkError', 'unitError'].forEach(function (id) { $(id).textContent = ''; });
    [nameIn, priceIn, bulkMinIn, bulkPriceIn, mainUnitIn].forEach(function (el) { el.classList.remove('invalid'); });
    openModal(addModal);
    setTimeout(function () {
      if (product || prefillName) { priceIn.focus(); priceIn.select(); }
      else nameIn.focus();
    }, 50);
  }
  function openAddModal(prefillName, thenAddToCart) { openProductModal(null, prefillName, thenAddToCart); }
  function openEditModal(id) {
    var p = findProduct(id);
    if (p) openProductModal(p);
  }

  priceIn.addEventListener('input', updatePriceHint);

  function saveProduct() {
    var name = nameIn.value.trim().replace(/\s+/g, ' ');
    var price = Number(digitsOnly(priceIn.value));
    var bulkMin = Number(digitsOnly(bulkMinIn.value)) || 0;
    var bulkPrice = Number(digitsOnly(bulkPriceIn.value)) || 0;
    var mainUnit = mainUnitIn.value.trim().replace(/\s+/g, ' ');
    var unitLabel = mainUnit || 'cái';
    var ok = true;

    ['nameError', 'priceError', 'bulkError', 'unitError'].forEach(function (id) { $(id).textContent = ''; });
    [nameIn, priceIn, bulkMinIn, bulkPriceIn, mainUnitIn].forEach(function (el) { el.classList.remove('invalid'); });

    // Cách bán khác (thùng, hộp…): dòng để trống cả tên lẫn giá thì bỏ qua
    var units = [], seen = [plain(unitLabel)];
    unitRowsEl.querySelectorAll('.unit-card').forEach(function (row) {
      var ni = row.querySelector('.unit-name'), pi = row.querySelector('.unit-price');
      ni.classList.remove('invalid');
      pi.classList.remove('invalid');
      var un = ni.value.trim().replace(/\s+/g, ' '), up = Number(digitsOnly(pi.value)) || 0;
      if (!un && !up) return;
      var err = '';
      if (!un) { err = 'Ghi tên cách bán: thùng, hộp, dây…'; ni.classList.add('invalid'); }
      else if (!up) { err = 'Nhập giá cho 1 ' + un + '.'; pi.classList.add('invalid'); }
      else if (seen.indexOf(plain(un)) >= 0) { err = 'Cách bán "' + un + '" bị trùng.'; ni.classList.add('invalid'); }
      if (err) {
        if (!$('unitError').textContent) $('unitError').textContent = err;
        ok = false;
        return;
      }
      seen.push(plain(un));
      units.push({ name: un, price: up });
    });

    // Giá sỉ: để trống ô giá sỉ nghĩa là món này không có giá sỉ
    if (bulkPrice) {
      if (bulkMin < 2) {
        $('bulkError').textContent = 'Số lượng mua sỉ phải từ 2 ' + unitLabel + ' trở lên.';
        bulkMinIn.classList.add('invalid'); ok = false;
      } else if (price && bulkPrice >= price) {
        $('bulkError').textContent = 'Giá sỉ phải thấp hơn giá lẻ (' + fmt(price) + ').';
        bulkPriceIn.classList.add('invalid'); ok = false;
      }
    }

    if (!name) {
      $('nameError').textContent = 'Vui lòng nhập tên sản phẩm.';
      nameIn.classList.add('invalid'); ok = false;
    } else if (products.some(function (p) { return p.id !== editingId && plain(p.name) === plain(name); })) {
      $('nameError').textContent = 'Món này đã có rồi.';
      nameIn.classList.add('invalid'); ok = false;
    }
    if (!price || price <= 0) {
      $('priceError').textContent = 'Vui lòng nhập giá cho 1 ' + unitLabel + '.';
      priceIn.classList.add('invalid'); ok = false;
    }
    if (!ok) return;

    function applyBulk(p) {
      if (bulkPrice) { p.bulkMin = bulkMin; p.bulkPrice = bulkPrice; }
      else { delete p.bulkMin; delete p.bulkPrice; }
      if (mainUnit) p.unit = mainUnit; else delete p.unit;
      if (units.length) p.units = units; else delete p.units;
    }

    if (editingId !== null) {
      // Sửa món có sẵn: giỏ hàng tự tính lại theo giá mới
      var edited = findProduct(editingId);
      edited.name = name;
      edited.price = price;
      applyBulk(edited);
      applyPhoto(edited.id);
      save(KEY_PRODUCTS, products);
      closeModal(addModal);
      pruneCart();
      commitCart();
      if (listScreen.classList.contains('open')) renderProductList();
      toast('Đã sửa: ' + name);
      return;
    }

    var maxId = products.reduce(function (m, p) { return Math.max(m, p.id); }, FIRST_USER_ID - 1);
    var product = { id: maxId + 1, name: name, price: price };
    applyBulk(product);
    applyPhoto(product.id);
    products.push(product);
    save(KEY_PRODUCTS, products);
    closeModal(addModal);
    if (listScreen.classList.contains('open')) renderProductList();

    if (addToCartAfterSave) addToCart(product.id);
    else toast('Đã lưu món: ' + name + ' – ' + fmt(price));
  }

  function deleteProduct() {
    var p = findProduct(editingId);
    if (!p) return;
    askConfirm('🗑️ Xóa món này?', 'Xóa "' + p.name + '" khỏi danh sách món? ' +
      'Nếu món đang có trong giỏ thì cũng bị bỏ ra.', 'Xóa món', function () {
      products = products.filter(function (x) { return x.id !== p.id; });
      if (photos[p.id]) deletePhoto(p.id);
      cart = cart.filter(function (c) { return c.id !== p.id; });
      save(KEY_PRODUCTS, products);
      commitCart();
      closeModal(addModal);
      if (listScreen.classList.contains('open')) renderProductList();
      toast('Đã xóa món: ' + p.name);
    });
  }

  $('btnOpenAdd').addEventListener('click', function () { openAddModal('', false); });
  $('btnCancelAdd').addEventListener('click', function () { closeModal(addModal); });
  $('btnSaveAdd').addEventListener('click', saveProduct);
  $('btnDeleteProduct').addEventListener('click', deleteProduct);
  nameIn.addEventListener('keydown', function (e) { if (e.key === 'Enter') priceIn.focus(); });
  priceIn.addEventListener('keydown', function (e) { if (e.key === 'Enter') saveProduct(); });

  // ---------- Nhập số lượng ----------
  var qtyModal = $('qtyModal'), qtyIn = $('qtyInput');
  var qtyEditingId = null, qtyEditingUnit = '';

  function updateQtyHint() {
    var p = findProduct(qtyEditingId);
    var q = Number(digitsOnly(qtyIn.value)) || 0;
    qtyIn.value = q ? String(q) : '';
    if (!p || !q) { $('qtyHint').innerHTML = ''; return; }
    var price = linePrice(p, qtyEditingUnit, q);
    $('qtyHint').innerHTML = 'Thành tiền: <b>' + fmt(price * q) + '</b>' +
      (!qtyEditingUnit && price < p.price ? ' (giá sỉ ' + fmt(price) + ' / ' + escapeHtml(mainUnitName(p)) + ')' : '');
  }
  function openQtyModal(id, unit) {
    unit = unit || '';
    var p = findProduct(id);
    var line = cart.find(function (c) { return sameLine(c, id, unit); });
    if (!p || !line) return;
    qtyEditingId = id;
    qtyEditingUnit = unit;
    $('qtyLabel').textContent = p.name + ' (' + fmt(linePrice(p, unit, 1)) + ' / ' + (unit || mainUnitName(p)) + ')';
    qtyIn.value = String(line.qty);
    updateQtyHint();
    openModal(qtyModal);
    setTimeout(function () { qtyIn.focus(); qtyIn.select(); }, 50);
  }
  function saveQty() {
    var q = Number(digitsOnly(qtyIn.value)) || 0;
    if (q > 9999) q = 9999;
    setQty(qtyEditingId, qtyEditingUnit, q);
    closeModal(qtyModal);
  }
  qtyIn.addEventListener('input', updateQtyHint);
  qtyIn.addEventListener('keydown', function (e) { if (e.key === 'Enter') saveQty(); });
  $('btnCancelQty').addEventListener('click', function () { closeModal(qtyModal); });
  $('btnSaveQty').addEventListener('click', saveQty);

  // ---------- Xóa & tạo đơn mới ----------
  $('btnNewOrder').addEventListener('click', function () {
    if (!cart.length) { toast('Giỏ hàng đang trống'); return; }
    askConfirm('🗑️ Xóa đơn này?', 'Tổng đơn hiện tại là ' + $('total').textContent +
      '. Xóa hết để tính đơn mới?', 'Xóa đơn', function () {
      cart = [];
      commitCart();
      toast('Đã tạo đơn mới');
      window.scrollTo(0, 0);
    });
  });

  renderCart();
  // Ảnh đọc từ bộ nhớ hơi chậm hơn, có rồi thì vẽ lại cho hiện ảnh
  loadAllPhotos().then(function () {
    renderCart();
    if (listScreen.classList.contains('open')) renderProductList();
  }).catch(function () {});

  // ---------- Dùng khi mất mạng (PWA) + tự cập nhật bản mới ----------
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    var hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadController) { hadController = true; return; } // lần cài đầu, không cần tải lại
      pendingReload = true;
      reloadIfIdle();
    });
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
      // Mở lại app từ màn hình chính (không tải lại trang) thì cũng kiểm tra bản mới
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') reg.update().catch(function () {});
      });
    }).catch(function () {});
  }
})();
</script>
</body>
</html>
